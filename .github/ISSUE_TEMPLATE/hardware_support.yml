name: Hardware support
description: Request support for a new board or Cirrus amplifier
title: "[Hardware]: "
labels: ["type: hardware-support", "status: needs-logs"]
body:
  - type: markdown
    attributes:
      value: |
        A model name alone is not enough to add hardware support. Include data from the actual machine.
        Check [supported hardware](https://github.com/hoaug-tran/CirrusAudioFixup#supported-hardware) first. For a failure on an already supported configuration, use **Bug report**.
        Linux: `sudo bash Tools/Collectors/collect_audio_amp_linux.sh`
        Windows PowerShell as Administrator: `powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Tools\Collectors\Collect-AudioAMP-Windows.ps1`
        macOS, if bootable: `sudo bash Tools/Collectors/collect_macos.sh`
        See [collector instructions](https://github.com/hoaug-tran/CirrusAudioFixup/blob/main/docs/guides/audio_collectors.md). Do not force a different board identity or copy another speaker's tuning to test compatibility.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing hardware requests and checked the current support list.
          required: true
        - label: The attached data comes from this machine; unknown identities and untested results are marked clearly.
          required: true
        - label: I reviewed attachments for personal data and can identify the source of any supplied firmware.
          required: true
  - type: input
    id: system
    attributes:
      label: Exact machine and CPU
      placeholder: "Manufacturer, full model/board name, CPU"
    validations:
      required: true
  - type: textarea
    id: operating_systems
    attributes:
      label: Operating systems and current audio behavior
      description: Give Linux/Windows/macOS versions actually tested and whether both speakers, headphones and microphone work in each. For Windows comparisons, note OEM effects if known. State the CirrusAudioFixup build/mode if already tested, or not installed.
    validations:
      required: true
  - type: dropdown
    id: bus
    attributes:
      label: Amplifier control bus
      description: Identify it from the collector, driver binding or ACPI resources; do not infer it from the CPU or ACPI HID alone.
      options:
        - I2C
        - SPI
        - SoundWire
        - Not identified yet
    validations:
      required: true
  - type: textarea
    id: identity
    attributes:
      label: Codec, amplifier and endpoint identities
      description: Give known codec/HDA SSID, amplifier model/revision, ACPI HID/_SUB, endpoint count, and I2C addresses or SPI controller/chip selects. Include the identity source. If the model or an ID is unknown, say so and point to the relevant collector file.
      placeholder: "Codec/HDA SSID; amplifier/revision; ACPI identity; bus/controller/endpoints; source files; unknown fields"
    validations:
      required: true
  - type: textarea
    id: reports
    attributes:
      label: Machine reports
      description: Attach at least one Linux or Windows collector archive from this machine; Linux codec/ACPI data is preferred for routing and bus resources. Include macOS data if available. Identify which OS produced each archive. If collection failed, supply its exact error and any partial output; a product-spec screenshot alone is insufficient.
    validations:
      required: true
  - type: textarea
    id: route
    attributes:
      label: macOS speaker route
      description: State whether AppleALC exposes the intended output and what route evidence is available. If checked, identify the codec dump and matching AppleALC source/resources. Otherwise say not checked or macOS not bootable. Do not assume the route is correct because headphones work.
    validations:
      required: true
  - type: textarea
    id: firmware
    attributes:
      label: Firmware, speaker tuning and board configuration
      description: Give the OEM package/version or Linux firmware/kernel source, filenames and hashes when available. Include known channel mapping, speaker ID, reset GPIO and boost topology from evidence. Distinguish measured calibration from coefficients. Say not available for missing data; do not fill in values from another laptop.
    validations:
      required: true
  - type: dropdown
    id: testing
    attributes:
      label: Follow-up testing available
      options:
        - I can test macOS builds and have a working recovery EFI
        - I can provide Linux or Windows data but cannot test macOS builds yet
        - I need help collecting further data
    validations:
      required: true
