name: CI & CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout pinned kernel SDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 7af1933c27aefcbdf4809ee44478829aad30f9c1
          path: MacKernelSDK

      - name: Checkout pinned Lilu headers
        uses: actions/checkout@v4
        with:
          repository: acidanthera/Lilu
          ref: e4748cc081bf060302c7d3c44a643ce1d11b7e1d
          path: Lilu

      - name: Show build environment
        run: |
          echo "macOS version: $(sw_vers -productVersion)"
          echo "Xcode version: $(xcodebuild -version | head -1)"
          python3 --version

      - name: Run host regression test suite
        run: |
          python3 Tests/reproduce_host.py
          python3 Tests/check_registers.py
          python3 Tests/check_transport.py
          python3 Tests/check_diagnostics.py
          python3 Tests/check_hda.py
          python3 Tests/check_calibration.py
          python3 Tests/check_bringup.py
          python3 Tests/check_runtime.py
          python3 Tests/check_audio_events.py
          python3 Tests/check_architecture.py
          python3 Tests/check_release.py
          python3 Tests/check_build_policy.py
          python3 Tests/check_tools.py
          python3 Tests/check_tuning.py
          python3 Tests/check_windows_payloads.py

      - name: Build Release kext
        run: |
          xcodebuild \
            -project CirrusAudioFixup.xcodeproj \
            -target CirrusAudioFixup \
            -configuration Release \
            -sdk macosx \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="${GITHUB_WORKSPACE}/build/Release" \
            build

      - name: Build Debug kext
        run: |
          xcodebuild \
            -project CirrusAudioFixup.xcodeproj \
            -target CirrusAudioFixup \
            -configuration Debug \
            -sdk macosx \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="${GITHUB_WORKSPACE}/build/Debug" \
            build

      - name: Verify build artifacts
        run: |
          python3 Tools/release_metadata.py
          for MODE in Release Debug; do
            BUNDLE="${GITHUB_WORKSPACE}/build/${MODE}/CirrusAudioFixup.kext"
            plutil -lint "${BUNDLE}/Contents/Info.plist"
            python3 Tools/release_metadata.py --bundle "$BUNDLE"
            lipo "${BUNDLE}/Contents/MacOS/CirrusAudioFixup" -verify_arch x86_64
            SYMBOLS="${BUNDLE}.dSYM/Contents/Resources/DWARF/CirrusAudioFixup"
            test -f "$SYMBOLS"
            BINARY_UUID="$(dwarfdump --uuid "${BUNDLE}/Contents/MacOS/CirrusAudioFixup" | awk '{print $2}')"
            SYMBOL_UUID="$(dwarfdump --uuid "$SYMBOLS" | awk '{print $2}')"
            test -n "$BINARY_UUID"
            test "$BINARY_UUID" = "$SYMBOL_UUID"
            /usr/libexec/PlistBuddy -c "Add :CirrusBuildCommit string ${GITHUB_SHA}" "${BUNDLE}/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CirrusBuildConfiguration string ${MODE}" "${BUNDLE}/Contents/Info.plist"
          done
          echo "--- Release kext ---"
          file "${GITHUB_WORKSPACE}/build/Release/CirrusAudioFixup.kext/Contents/MacOS/CirrusAudioFixup"
          echo "--- Debug kext ---"
          file "${GITHUB_WORKSPACE}/build/Debug/CirrusAudioFixup.kext/Contents/MacOS/CirrusAudioFixup"

      - name: Package kext bundles
        run: |
          cd "${GITHUB_WORKSPACE}/build/Release"
          zip -qry "${GITHUB_WORKSPACE}/CirrusAudioFixup-RELEASE.zip" CirrusAudioFixup.kext

          cd "${GITHUB_WORKSPACE}/build/Debug"
          zip -qry "${GITHUB_WORKSPACE}/CirrusAudioFixup-DEBUG.zip" CirrusAudioFixup.kext

          cd "${GITHUB_WORKSPACE}"
          zip -qry CirrusAudioFixup-SYMBOLS.zip build/Release/*.dSYM build/Debug/*.dSYM
          ls -lh CirrusAudioFixup-*.zip

      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: CirrusAudioFixup-RELEASE-${{ github.sha }}
          path: CirrusAudioFixup-RELEASE.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: CirrusAudioFixup-DEBUG-${{ github.sha }}
          path: CirrusAudioFixup-DEBUG.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload matching debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: CirrusAudioFixup-SYMBOLS-${{ github.sha }}
          path: CirrusAudioFixup-SYMBOLS.zip
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: CirrusAudioFixup-RELEASE-${{ github.sha }}
          path: dist

      - name: Download Debug artifact
        uses: actions/download-artifact@v4
        with:
          name: CirrusAudioFixup-DEBUG-${{ github.sha }}
          path: dist

      - name: Validate release identity
        id: changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 Tools/release_metadata.py --tag "$RELEASE_TAG" --output-dir dist

      - name: Download matching debug symbols
        uses: actions/download-artifact@v4
        with:
          name: CirrusAudioFixup-SYMBOLS-${{ github.sha }}
          path: dist

      - name: Prepare versioned release assets
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          cp dist/CirrusAudioFixup-RELEASE.zip "CirrusAudioFixup-${VERSION}-RELEASE.zip"
          cp dist/CirrusAudioFixup-DEBUG.zip "CirrusAudioFixup-${VERSION}-DEBUG.zip"
          cp dist/CirrusAudioFixup-SYMBOLS.zip "CirrusAudioFixup-${VERSION}-SYMBOLS.zip"
          shasum -a 256 CirrusAudioFixup-${VERSION}-RELEASE.zip CirrusAudioFixup-${VERSION}-DEBUG.zip CirrusAudioFixup-${VERSION}-SYMBOLS.zip > SHA256SUMS
          ls -la CirrusAudioFixup-*.zip
          cat dist/RELEASE_NOTES.md

      - name: Publish a new version (never overwrite an existing release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "CirrusAudioFixup $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md \
            "CirrusAudioFixup-${RELEASE_VERSION}-RELEASE.zip" \
            "CirrusAudioFixup-${RELEASE_VERSION}-DEBUG.zip" \
            "CirrusAudioFixup-${RELEASE_VERSION}-SYMBOLS.zip" SHA256SUMS dist/BUILD_METADATA.json
